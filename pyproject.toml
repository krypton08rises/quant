[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "quant_fly"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "kiteconnect>=3.13",
    "dill>=0.3.7",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "yfinance>=0.2.32",
    "requests>=2.31",
    "tqdm>=4.65",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.9",
    "ruff>=0.0.287",
    "pre-commit>=3.4",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.black]
line-length = 100 # Standard is 88, 100 gives more breathing room for long pandas operations
target-version = ['py310']
exclude = '''
/(
    \.git
  | \.venv
  | data
  | logs
)/
'''

[tool.ruff]
line-length = 100
exclude = [
    "**wastebin**",
]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort (automatically sorts your imports alphabetically and by type)
    "W",  # pycodestyle warnings
]
ignore = ["E501"] # Let black handle line length

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
